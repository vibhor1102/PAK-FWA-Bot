services:
  - type: web
    name: pak-fwa-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    healthCheckPath: /health
    envVars:
      - key: BOT_RUNTIME
        value: production
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pak-fwa-bot-db
          property: connectionString
    autoDeploy: true

databases:
  - name: pak-fwa-bot-db
    plan: free
